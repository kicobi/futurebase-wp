# Lead workspace config — TEMPLATE.
# `lead init` copies this into ~/Sites/leads/<slug>/project.yml and fills the
# name, slug, type, platform, and created_at from the command. The values below
# are neutral, schema-valid defaults (so the design validator stays green) —
# replace them for a real lead.
schema_version: 1

project:
  name: Example Lead
  slug: example-lead
  stage: lead
  status: assessing
  type: redesign        # new | redesign
  platform: codeable    # codeable | direct | other
  created_at: "2026-01-01"

# A lead references the starter READ-ONLY. No template_commit yet — that is
# recorded only at promotion, from the created project repo's provenance.
starter:
  source_path: /Users/colin/Sites/wp-starter

urls:
  production: null
  staging: null

baseline:
  mode: redesign

privacy:
  local_only: true
  allow_git: false      # leads are local-only by default; no git until promotion
  allow_credentials_in_project: false

preset: redesign
