name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    node:
        name: Node (lint + build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run lint:css
            - run: npm run build
            - name: Check committed build output
              run: |
                  if [ -n "$(git status --porcelain -- build)" ]; then
                      echo "Committed build output is stale. Run 'npm run build' and commit the updated build/ files."
                      git status --short -- build
                      git diff -- build
                      exit 1
                  fi

    php:
        name: PHP (phpcs + phpstan)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ hashFiles('composer.json') }}
                  restore-keys: composer-

            - run: composer install --prefer-dist --no-progress --no-interaction
            - run: composer phpcs
            - run: composer phpstan

    scaffold:
        name: Scaffold smoke tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress --no-interaction
            - name: Run scaffold probes
              run: |
                  npm run block:new -- client-logo-strip
                  npm run block:new -- marketing-feature-panel-component
                  if npm run block:new -- Bad_Block; then
                      echo "Expected invalid block slug to fail."
                      exit 1
                  fi

                  npm run cpt:new -- book
                  npm run cpt:new -- case-study
                  npm run cpt:new -- person --plural people
                  if npm run cpt:new -- extraordinarily-long-case-study; then
                      echo "Expected overlong CPT slug to fail."
                      exit 1
                  fi

                  npm run build
                  npm run verify

    package:
        name: Package smoke test
        runs-on: ubuntu-latest
        needs: [node]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run package:check

    a11y:
        name: Accessibility (wp-env + pa11y)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [node]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: npm run env:start
            # Activates the theme and imports the fixture. Without it wp-env
            # serves core's default theme and this gate greens on the wrong
            # software; a11y-wp-env.sh now refuses to run in that state.
            - run: npm run demo:import
            - run: npm run a11y
            - run: npm run env:stop
              if: always()

    verify:
        name: Verify (block theme standards)
        runs-on: ubuntu-latest
        needs: [node, php]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress --no-interaction
            - run: bin/verify-theme.sh
