name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    node:
        name: Node (lint + build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run lint:css
            - run: npm run build
            - name: Check committed build output
              run: |
                  if [ -n "$(git status --porcelain -- build)" ]; then
                      echo "Committed build output is stale. Run 'npm run build' and commit the updated build/ files."
                      git status --short -- build
                      git diff -- build
                      exit 1
                  fi

    php:
        name: PHP (phpcs + phpstan)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ hashFiles('composer.json') }}
                  restore-keys: composer-

            - run: composer install --prefer-dist --no-progress --no-interaction
            - run: composer phpcs
            - run: composer phpstan

    scaffold:
        name: Scaffold smoke tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress --no-interaction
            - name: Run scaffold probes
              run: |
                  npm run block:new -- client-logo-strip
                  npm run block:new -- marketing-feature-panel-component
                  if npm run block:new -- Bad_Block; then
                      echo "Expected invalid block slug to fail."
                      exit 1
                  fi

                  npm run cpt:new -- book
                  npm run cpt:new -- case-study
                  npm run cpt:new -- person --plural people
                  if npm run cpt:new -- extraordinarily-long-case-study; then
                      echo "Expected overlong CPT slug to fail."
                      exit 1
                  fi

                  npm run build
                  npm run verify

    package:
        name: Package smoke test
        runs-on: ubuntu-latest
        needs: [node]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run package:check

    a11y:
        name: Accessibility (wp-env + pa11y)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [node]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: npm run env:start
            - run: npm run a11y
            - run: npm run env:stop
              if: always()

    verify:
        name: Verify (block theme standards)
        runs-on: ubuntu-latest
        needs: [node, php]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress --no-interaction
            - run: bin/verify-theme.sh
