name: CI

# `pull_request` carries no branch filter on purpose.
#
# With `branches: [main]` a pull request opened against anything other than
# main never ran — which is every pull request in a stack. They reported zero
# checks, and retargeting one to main afterwards does not help: that fires
# `edited`, and this workflow listens for the default `opened`, `synchronize`
# and `reopened`. The only way to get a run was to close and reopen the pull
# request by hand.
#
# Unfiltered, each pull request is checked against the base it will actually
# merge into, which is the point of checking it at all. The concurrency group
# below keys on `github.ref`, and for a pull request that resolves to
# `refs/pull/<n>/merge`, so stacked runs do not cancel one another.
#
# `push` keeps its filter. A branch with an open pull request is already
# covered by `synchronize`; running both would double every job.
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    node:
        name: Node (lint + build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run lint:css
            - run: npm run lint:pkg
            - run: npm run build
            - name: Check committed build output
              run: |
                  if [ -n "$(git status --porcelain -- build)" ]; then
                      echo "Committed build output is stale. Run 'npm run build' and commit the updated build/ files."
                      git status --short -- build
                      git diff -- build
                      exit 1
                  fi

    php:
        name: PHP (phpcs + phpstan)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ hashFiles('composer.json') }}
                  restore-keys: composer-

            - run: composer install --prefer-dist --no-progress --no-interaction
            - run: composer phpcs
            - run: composer phpstan

    scaffold:
        name: Scaffold smoke tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress --no-interaction

            # The project-system guards — secret scanning and path containment.
            # These decide what gets copied into a client repository and what is
            # examined before it goes, so they are gated rather than trusted.
            - name: Project-system guard tests
              run: npm ci --prefix tools/project-system && npm test --prefix tools/project-system

            - name: Run scaffold probes
              run: |
                  npm run block:new -- client-logo-strip
                  npm run block:new -- marketing-feature-panel-component
                  if npm run block:new -- Bad_Block; then
                      echo "Expected invalid block slug to fail."
                      exit 1
                  fi

                  npm run cpt:new -- book
                  npm run cpt:new -- case-study
                  npm run cpt:new -- person --plural people
                  if npm run cpt:new -- extraordinarily-long-case-study; then
                      echo "Expected overlong CPT slug to fail."
                      exit 1
                  fi

                  npm run build
                  npm run verify

            # This workflow is CLASS.SAFE and syncs verbatim into every client
            # and promoted project. Without the guard, the template-only check
            # asserts each client is still Futurebase WP and fails their CI
            # permanently. bin/test-rename.sh asserts this guard stays exact.
            - name: Require Futurebase WP rename template smoke test
              if: github.repository == 'kicobi/futurebase-wp'
              run: bash bin/test-rename.sh --require-template

    package:
        name: Package smoke test
        runs-on: ubuntu-latest
        needs: [node]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run package:check

    a11y:
        name: Accessibility (wp-env + pa11y)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [node]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: npm run env:start
            # inc/ is CLASS.NEVER, so sync never delivers the navigation
            # migration to a client — a project promoted before that feature
            # existed has nothing for this gate to exercise, and the synced
            # workflow would fail it forever. Run it where the feature is.
            - name: Navigation migration
              if: hashFiles('inc/navigation-migration.php') != ''
              run: npm run test:navigation
            # Activates the theme and imports the fixture. Without it wp-env
            # serves core's default theme and this gate greens on the wrong
            # software; a11y-wp-env.sh now refuses to run in that state.
            - run: npm run demo:import
            - run: npm run a11y
            - run: npm run env:stop
              if: always()

    verify:
        name: Verify (block theme standards)
        runs-on: ubuntu-latest
        needs: [node, php]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'
                  tools: composer:v2
                  coverage: none

            - run: npm ci
            - run: composer install --prefer-dist --no-progress --no-interaction
            - run: bin/verify-theme.sh
