name: Scorecard

# Heavy job (48+ Lighthouse passes) — runs on main, nightly, releases, and
# manual dispatch. PRs run it only when labeled `scorecard`. Numbers produced
# here are a regression gate; published scorecard numbers come from the
# public demo site (see the roadmap plan / docs).

on:
    push:
        branches: [main]
        tags: ['v*']
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:
    pull_request:
        branches: [main]
        types: [opened, synchronize, labeled]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    scorecard:
        name: Scorecard (LHCI + pa11y over demo fixture)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'scorecard')
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: npm run env:start

            - name: Render smoke test (demo fixture)
              run: bin/smoke-render.sh

            - name: Scorecard (Lighthouse mobile + desktop, pa11y)
              run: bin/scorecard.sh

            - name: Upload raw reports
              if: always()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: scorecard-${{ github.run_id }}
                  path: .artifacts/scorecard/
                  if-no-files-found: error
                  retention-days: 30

            - run: npm run env:stop
              if: always()
