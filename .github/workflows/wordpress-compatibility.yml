name: WordPress compatibility

# Futurebase-only compatibility canary. This workflow is intentionally listed
# in tools/project-system/lib/sync.mjs STARTER_ONLY: promoted projects keep
# their normal CI without inheriting this starter compatibility matrix.
on:
    pull_request:
    push:
        branches: [main]
    release:
        types: [published]
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    matrix:
        runs-on: ubuntu-latest
        outputs:
            include: ${{ steps.matrix.outputs.include }}
        steps:
            - id: matrix
              env:
                  FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
              run: |
                  node <<'JS'
                  const fs = require('node:fs');
                  const include = [];
                  for (const channel of ['floor', 'latest']) {
                      for (const php of ['8.3', '8.4', '8.5']) {
                          if (process.env.FULL_MATRIX !== 'true' && !((channel === 'floor' && php === '8.3') || (channel === 'latest' && php === '8.5'))) continue;
                          include.push({ channel, php, core: channel === 'floor' ? '' : 'https://wordpress.org/latest.zip' });
                      }
                  }
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `include=${JSON.stringify(include)}\n`);
                  JS
    wordpress:
        needs: matrix
        name: WordPress ${{ matrix.channel }} / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.matrix.outputs.include) }}
        env:
            CI: 'true'
            # An empty value leaves .wp-env.json authoritative for the floor.
            WP_ENV_CORE: ${{ matrix.core }}
            WP_ENV_PHP_VERSION: ${{ matrix.php }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm install --global npm@11.16.0
            - run: npm ci
            - run: npm run build
            - run: npm run build:seo
            - run: npm run env:start

            - name: Verify the WordPress version under test
              shell: bash
              run: |
                  set -euo pipefail
                  installed=$(
                      npx --silent wp-env run cli wp core version 2>/dev/null \
                          | grep -E '^[0-9]+\.[0-9]+' \
                          | head -1
                  )
                  if [ -z "$installed" ]; then
                      echo "error: could not resolve the installed WordPress version" >&2
                      exit 1
                  fi
                  {
                      echo "### WordPress ${{ matrix.channel }} / PHP ${{ matrix.php }}"
                      echo
                      echo "Resolved version: \`$installed\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  if [ "${{ matrix.channel }}" = floor ]; then
                      node bin/verify-version-surfaces.mjs "--assert-floor=$installed"
                  else
                      node bin/verify-version-surfaces.mjs "--warn-newer=$installed"
                  fi

            # Activate the mounted theme and import the deterministic fixture
            # before any runtime gate. A green result against a core default
            # theme would not be compatibility evidence for Futurebase.
            - name: Activate theme and import demo fixture
              run: npm run demo:import

            - name: Companion SEO clean install
              run: bin/test-seo-install.sh

            - name: Companion SEO runtime
              run: bin/test-seo-runtime.sh

            - name: Navigation migration
              run: npm run test:navigation

            - name: Theme hardening runtime
              run: bin/test-theme-runtime.sh

            - name: Render smoke test
              run: bin/smoke-render.sh

            - name: Accessibility
              run: npm run a11y

            - name: Install release ZIPs in clean WordPress
              run: bin/test-release-install.sh

            - name: Stop wp-env
              if: always()
              run: npm run env:stop
